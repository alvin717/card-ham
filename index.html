<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>공식 모바일 명함 서비스 센터</title>

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="공식 모바일 명함 센터">
  <meta property="og:description" content="이진형 실장 &middot; 신은호 대표 &middot; 함용순 팀장 공식 모바일 명함 포털">
  <meta property="og:url" content="https://alvin717.github.io/my--card/">

  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      width: 100%;
      min-height: 100vh;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      color: #f8fafc;
      padding: 30px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      line-height: 1.5;
      word-break: keep-all;
    }

    .hub-container {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
    }

    .hub-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .hub-badge {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 700;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .hub-title {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      color: #ffffff;
    }

    .hub-desc {
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .person-card {
      display: flex;
      align-items: center;
      padding: 16px 18px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .person-card:hover, .person-card:active {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(56, 189, 248, 0.5);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
    }

    .avatar-box {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      margin-right: 16px;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .avatar-lee {
      background: linear-gradient(135deg, #0b3b60 0%, #165b94 100%);
    }

    .avatar-shin {
      background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
    }

    .avatar-ham {
      background: linear-gradient(135deg, #0c4da2 0%, #002c6c 100%);
    }

    .person-info {
      flex: 1;
      min-width: 0;
    }

    .person-name-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 3px;
    }

    .person-name {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
    }

    .person-tag {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
    }

    .person-company {
      font-size: 0.84rem;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .person-phone {
      font-size: 0.8rem;
      color: #38bdf8;
      font-weight: 500;
      margin-top: 2px;
    }

    .arrow-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      color: #94a3b8;
      margin-left: 10px;
      flex-shrink: 0;
    }

    .hub-footer {
      text-align: center;
      margin-top: 30px;
      font-size: 0.78rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <main class="hub-container">
    <header class="hub-header">
      <span class="hub-badge">Official Digital Card</span>
      <h1 class="hub-title">공식 모바일 명함</h1>
      <p class="hub-desc">확인하시려는 담당자 명함을 선택해 주세요</p>
    </header>

    <div class="card-list">
      <!-- 1. 이진형 실장 -->
      <a href="./lee/" class="person-card">
        <div class="avatar-box avatar-lee">🏢</div>
        <div class="person-info">
          <div class="person-name-row">
            <strong class="person-name">이진형</strong>
            <span class="person-tag">실장</span>
          </div>
          <div class="person-company">힐스테이트 회룡역파크뷰 (3본부 2팀)</div>
          <div class="person-phone">📞 010-7675-3098</div>
        </div>
        <div class="arrow-btn">&gt;</div>
      </a>

      <!-- 2. 신은호 대표 -->
      <a href="./shin/" class="person-card">
        <div class="avatar-box avatar-shin">📐</div>
        <div class="person-info">
          <div class="person-name-row">
            <strong class="person-name">신은호</strong>
            <span class="person-tag">CEO</span>
          </div>
          <div class="person-company">indesign plus (인디자인플러스)</div>
          <div class="person-phone">📞 010-8691-2938</div>
        </div>
        <div class="arrow-btn">&gt;</div>
      </a>

      <!-- 3. 함용순 팀장 -->
      <a href="./ham/" class="person-card">
        <div class="avatar-box avatar-ham">🛡️</div>
        <div class="person-info">
          <div class="person-name-row">
            <strong class="person-name">함용순</strong>
            <span class="person-tag">팀장</span>
          </div>
          <div class="person-company">삼성생명 &middot; 화재 &middot; 카드 속초금융지점</div>
          <div class="person-phone">📞 010-7707-4988</div>
        </div>
        <div class="arrow-btn">&gt;</div>
      </a>
    </div>

    <footer class="hub-footer">
      <p>※ 원하시는 명함을 터치하시면 상세 명함 페이지로 이동합니다.</p>
    </footer>
  </main>
</body>
</html>
